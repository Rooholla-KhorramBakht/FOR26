# Settings of the particle filter (localization_node). Change them here, build again, and restart the
# launch file. Each one is explained at the top of localization_node.py.
localization_node:
  ros__parameters:
    num_particles: 2000
    estimate: "best"                          # "best" (largest weight) or "mean"
    motion_noise: [0.1, 0.1, 0.002, 0.002]    # alpha_translation, alpha_rotation, sigma_xy_min (m), sigma_theta_min (rad)
    measurement_sigmas: [0.1, 0.087, 0.1]     # range (fraction of the range), bearing (rad, 5 deg), facing (rad per metre of range)
    resample_noise: [0.01, 0.01]              # xy (m), theta (rad)
    resample_threshold: 0.5
    random_fraction: 0.01
    recovery_rates: [0.0, 0.0]               # [slow, fast]: augmented MCL, off. Try e.g. [0.05, 0.5]
    max_range: 5.0
    update_min_motion: [0.02, 0.03]           # update after moving 2 cm or turning 1.7 deg...
    update_max_interval: 1.0                  # ...or after 1 s
    map_margin: 0.5
