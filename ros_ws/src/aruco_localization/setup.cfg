[develop]
script_dir=$base/lib/aruco_localization
[install]
install_scripts=$base/lib/aruco_localization
# Start the nodes with whichever "python3" is active (the conda environment), not always the
# system Python. Without this, "ros2 run" cannot import mujoco, lekiwi_sim or lerobot.
[build_scripts]
executable=/usr/bin/env python3
